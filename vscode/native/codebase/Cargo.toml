[package]
name = "openide-codebase"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
regex = "=1.12.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tree-sitter = "=0.25.10"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"

[profile.release]
lto = "thin"
strip = true
