# zizmor configuration (security audit of the workflows).
#
# A rule is listed here only when the finding is a false positive FOR THIS repository and the
# reason can be written down. An `ignore` without a reason is a rule switched off that nobody
# dares switch back on.
rules:
  artipacked:
    ignore:
      # `sync-codeoss` pushes the branch that opens the update PR, so it needs git's credentials
      # in `.git/config`. Every other checkout in the repository uses `persist-credentials: false`;
      # this one cannot.
      - sync-codeoss.yml
      # The `publish` job of the release pushes the signed update feed to the `updates` branch
      # (`dev/publish-update-feed.sh`). Its `build` job, which is the one that runs third-party
      # code and uploads artifacts, does drop its credentials.
      - release-openide.yml
