name: Sync Code OSS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit o tag de microsoft/vscode (vacío = stable actual)
        required: false
        type: string
  schedule:
    - cron: '23 8 * * 1'

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name openide-bot
          git config user.email openide-bot@users.noreply.github.com
          git switch -c "sync/codeoss-${GITHUB_RUN_ID}"

      - name: Integrate Code OSS delta
        id: integrate
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: ./dev/sync-codeoss.sh --prepare "${TARGET_REF}"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Install native dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Test fork inventory and synchronization fixtures
        run: node --test dev/audit-fork-delta.test.mjs dev/codeoss-sync.test.mjs

      - name: Validate integration and advance base metadata
        run: |
          if test -f "$(git rev-parse --git-path openide-codeoss-sync.json)"; then
            ./dev/sync-codeoss.sh --continue
          fi

      - name: Publish synchronization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeoss-sync-${{ github.run_id }}
          path: .build/codeoss-sync/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Open synchronization PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "No hay una versión nueva de Code OSS."
            exit 0
          fi
          CODE_OSS_VERSION=$(jq -r '.codeOss.version' openide-version.json)
          BRANCH=$(git branch --show-current)
          git commit -m "chore(codeoss): sync ${CODE_OSS_VERSION}"
          git push --set-upstream origin "${BRANCH}"
          cat > "${RUNNER_TEMP}/codeoss-pr.md" <<EOF
          Integrates Code OSS ${CODE_OSS_VERSION} while retaining the OpenIDE product version.

          Validation passed: source layers, client typecheck, fresh transpilation, and agent/host/repository tests. Fork inventory and sync regression fixtures also passed. The full CI workflow is explicitly dispatched on this branch for browser, Electron and product smoke coverage; review additional affected upstream subsystem tests before merging.

          The deterministic fork inventory, incoming upstream patch, conflict report and validation logs are retained in the [workflow artifacts](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Counts identify maintenance work; they are not a quality score.
          EOF
          gh pr create \
            --title "chore(codeoss): sync ${CODE_OSS_VERSION}" \
            --body-file "${RUNNER_TEMP}/codeoss-pr.md"
          # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
          gh workflow run ci-openide.yml --ref "${BRANCH}"
