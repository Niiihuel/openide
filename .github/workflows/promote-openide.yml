name: Promote OpenIDE Stable
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Signed draft tag (vX.Y.Z)', required: true }
permissions: { contents: write }
jobs:
  promote:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        # Ninguno de estos jobs hace push: sin esto el token del checkout queda escrito en
        # `.git/config` y puede viajar dentro de un artifact.
        with: { persist-credentials: false }
      - name: Verify complete signed release
        # El tag entra por `env`, NO interpolado en el script. `${{ }}` se expande al ARMAR el
        # shell, antes de que corra una sola línea, así que la validación con regex de abajo llega
        # tarde: un valor con comillas ya habría cerrado la asignación e inyectado sus propios
        # comandos en el workflow que publica las releases. Por `env` el valor es un dato para bash,
        # nunca parte del programa, y ahí sí la regex es la que decide.
        env:
          GH_TOKEN: '${{ github.token }}'
          INPUT_TAG: '${{ inputs.tag }}'
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"; [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$tag" --json isDraft,isPrerelease --jq 'select(.isDraft == true and .isPrerelease == false)' >/dev/null
          assets=$(gh release view "$tag" --json assets --jq '[.assets[].name]')
          for required in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do jq -e --arg p "$required" 'any(.[]; contains($p))' <<<"$assets" >/dev/null; done
          gh release edit "$tag" --draft=false --latest
