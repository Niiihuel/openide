name: Promote OpenIDE Stable
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Verified release tag (vX.Y.Z)', required: true }
permissions: { contents: write, actions: read }
concurrency:
  group: openide-stable-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        run: '[[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      # Check out the release's scripts, trusted key and metadata without storing credentials.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: '${{ inputs.tag }}', persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - name: Download successful build and release assets
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          run=$(gh run list --workflow release-openide.yml --commit "$sha" --status success --json databaseId --jq '.[0].databaseId')
          [[ "$run" =~ ^[0-9]+$ ]] || { echo 'No successful release build for this tag.' >&2; exit 1; }
          gh run download "$run" --name openide-update-feed --dir update-feed
          gh release view "$INPUT_TAG" --json isPrerelease | jq -e '.isPrerelease == false'
          gh release download "$INPUT_TAG" --dir release-assets
          node dev/verify-release-feed.mjs update-feed release-assets "$INPUT_TAG"
      - name: Publish release before announcing the update
        run: |
          set -euo pipefail
          gh release edit "$INPUT_TAG" --draft=false --latest
          # Confirm public access without the workflow token before touching the feed.
          for manifest in update-feed/stable/*/*/*/latest.json; do
            curl --fail --silent --show-error --location --head --retry 5 --retry-all-errors "$(jq -er '.artifact.url' "$manifest")" >/dev/null
          done
          # The helper reads GH_TOKEN from the environment; no token is stored in .git/config.
          gh auth setup-git --hostname github.com
          ./dev/publish-update-feed.sh update-feed updates
