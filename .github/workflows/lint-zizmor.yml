name: Lint - zizmor

on:
  push:
    branches:
      - master
      - insider
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` es obligatorio desde que el repositorio es privado: el
      # workflow declara `permissions: {}` arriba, así que el token no hereda
      # nada, y un checkout sin permiso de lectura falla con "repository not
      # found" — que suena a URL equivocada y es en realidad falta de permiso.
      # En un repositorio público no hacía falta porque el clone es anónimo.
      contents: read
      security-events: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          # Sólo NUESTROS workflows. Por defecto barre el repositorio entero, y eso incluye
          # `vscode/.github/`, que son los workflows de Microsoft que vienen con el árbol
          # vendorizado: hallazgos que no podemos arreglar y que además no corren nunca acá,
          # porque GitHub sólo ejecuta lo que está en `.github/workflows/` de la raíz.
          inputs: .github/workflows/
          # Sin subir SARIF: la acción por defecto publica los hallazgos en code
          # scanning, y eso en un repositorio PRIVADO exige GitHub Advanced
          # Security. Sin ese plan la subida falla con "Resource not accessible
          # by integration" y tumba el job aunque zizmor no haya encontrado
          # nada — un lint que reprueba por dónde publica su informe, no por lo
          # que dice. Los hallazgos van al log y el job falla si los hay.
          # Cuando el repositorio pase a público, volver a activarlo.
          advanced-security: false
