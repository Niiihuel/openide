name: Release OpenIDE Insider
# NO `schedule:`, on purpose. The nightly cron ran every weekday for weeks and failed every time
# in 14 seconds on the `test "$OPENIDE_CHANNEL" = insider` below, because it fires against `master`
# and `openide-version.json` there says `"channel": "stable"`. A cron that cannot pass is not a
# safety net, it is a broken red dot next to every real failure.
#
# It is not a matter of relaxing the guard either: `release-openide.yml` hardcodes
# `VSCODE_QUALITY: stable` at job level and only triggers on `v<x>.<y>.<z>` tags, so dispatching it
# from here would build and sign a STABLE release and publish it as insider. Turning the channel on
# means, at minimum: an insider version line in `openide-version.json` (`x.y.z-insider.YYYYMMDD.n`,
# the shape `version.sh` and the manifest parser already validate), a `quality` input threaded
# through `release-openide.yml` into `VSCODE_QUALITY`, and the matching arm in `promote-openide.yml`.
# Until that exists this stays dispatch-only, where the guard below is an honest precondition
# instead of a daily false alarm.
on:
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        # None of these jobs push: without this the checkout token is written into `.git/config`
        # and can travel inside an artifact.
        with: { persist-credentials: false }
      - name: Require insider version and signing key
        env: { OPENIDE_UPDATE_PRIVATE_KEY_CONTENT: '${{ secrets.OPENIDE_UPDATE_PRIVATE_KEY }}' }
        run: |
          . ./version.sh
          test "$OPENIDE_CHANNEL" = insider
          test -n "$OPENIDE_UPDATE_PRIVATE_KEY_CONTENT"
      - name: Dispatch shared release workflow
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run release-openide.yml --ref "${GITHUB_REF_NAME}"
