name: CI OpenIDE

on:
  workflow_dispatch: {}
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  cli-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - name: Install CLI build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y pkg-config libssl-dev
      - name: Check native CLI integration
        working-directory: vscode/cli
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --bin code

  compile-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        # None of these jobs push: without this the checkout token is written into `.git/config`
        # and can travel inside an artifact.
        with: { persist-credentials: false }

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install native dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev bubblewrap

      - name: Install JavaScript dependencies
        working-directory: vscode
        run: npm ci

      - name: Validate reliability gates
        run: |
          node dev/check-reliability-gates.mjs
          node --test dev/reliability-gates.test.mjs

      - name: Test release feed verification
        run: node --test dev/verify-release-feed.test.mjs

      - name: Test upstream synchronization
        run: node --test dev/codeoss-sync.test.mjs dev/audit-fork-delta.test.mjs

      - name: Audit version consistency
        run: node dev/audit-version-consistency.mjs

      - name: Audit distributed OpenIDE branding
        run: node dev/audit-branding.mjs

      - name: Audit comment language
        run: node dev/audit-comment-language.mjs

      - name: Audit prompt language
        run: node dev/audit-prompt-language.mjs

      - name: Audit fork localize()
        run: node dev/audit-fork-localize.mjs

      - name: Audit surface tokens
        run: |
          node dev/audit-surface-tokens.mjs
          node --test dev/audit-surface-tokens.test.mjs

      - name: Audit production regular expressions
        run: node dev/audit-production-regex.mjs

      - name: Audit script permissions
        run: node dev/audit-script-permissions.mjs

      - name: Validate source layers
        working-directory: vscode
        run: npm run valid-layers-check

      - name: Typecheck canonical source
        working-directory: vscode
        run: npm run typecheck-client

      - name: Transpile canonical source
        working-directory: vscode
        run: npm run gulp copy-codicons && npm run transpile-client

      - name: Build bundled extensions and fetch Electron
        working-directory: vscode
        run: npm run gulp compile-extensions compile-extension-media && npm run electron

      - name: Test signed updater contract
        working-directory: vscode
        run: >-
          ./node_modules/.bin/mocha --ui tdd --timeout 10000 --exit
          out/vs/platform/update/test/common/openideUpdateManifest.test.js
          out/vs/platform/update/test/node/openideUpdateVerifier.test.js
          out/vs/platform/update/test/electron-main/openideAppImageUpdater.test.js

      - name: Test binary request transport
        working-directory: vscode
        run: node test/unit/node/index.js --runGlob 'vs/platform/request/test/node/*.test.js'

      - name: Require Linux process confinement
        working-directory: vscode
        run: >-
          node --input-type=module -e "import { OpenideProcessIsolation } from './out/vs/platform/openideAgentHost/node/openideProcessIsolation.js';
          const status = await new OpenideProcessIsolation().status(); if (!status.available) { throw new Error(status.reason); }"

      - name: Test connection ownership and restore coordination
        working-directory: vscode
        run: >-
          ./node_modules/.bin/mocha --ui tdd --timeout 10000 --exit
          out/vs/base/parts/ipc/test/common/ipc.test.js
          out/vs/platform/openideAgentHost/test/node/*.test.js

      - name: Test OpenIDE agent common
        working-directory: vscode
        run: >-
          ./node_modules/.bin/mocha --ui tdd --timeout 10000 --exit
          out/vs/platform/openideAgentHost/test/common/openideAgentHost.test.js
          out/vs/workbench/contrib/openideAgent/test/common/*.test.js

      # The static contracts over the repository: that every declared setting is read, that the
      # Settings search index does not point at dead surfaces, that what the layout reserves and
      # what the CSS paints measure the same, and that a plan Build cannot start on top of a live
      # run. They were left out of CI when they were added: all four were broken with nothing
      # saying so, and two of them were hiding real problems.
      # `--timeout 30000` rather than the 10s the rest use: these walk and read the ~7,600 sources
      # under `vscode/src`, so their cost is disk, not compute. On the runner's cold disk they
      # grazed the limit and failed on timeout — which reads as a flake and gets re-run instead of
      # read. The suite takes under a second on a warm disk; the margin is for the cold start.
      - name: Test OpenIDE repository contracts
        working-directory: vscode
        run: >-
          ./node_modules/.bin/mocha --ui tdd --timeout 30000 --exit
          out/vs/workbench/contrib/openideAgent/test/node/*.test.js

      - name: Install Chromium for browser tests
        working-directory: vscode
        run: npx playwright install --with-deps chromium

      - name: Test OpenIDE agent browser
        working-directory: vscode
        run: >-
          npm run test-browser-no-install --
          --runGlob 'vs/workbench/contrib/openideAgent/test/browser/*.test.js'
          --browser chromium

      - name: Test Electron browser integration
        working-directory: vscode
        run: >-
          xvfb-run -a .build/electron/openide test/unit/electron/index.js
          --no-sandbox --disable-gpu --ozone-platform=x11
          --runGlob 'vs/workbench/contrib/browserView/test/electron-browser/**/*.test.js'

      - name: Test updater main process lifecycle
        run: xvfb-run -a vscode/.build/electron/openide dev/test-updater-main.mjs --no-sandbox --ozone-platform=x11
      - name: Test AppImage launcher recovery after process death
        run: node dev/test-appimage-recovery.mjs
      - name: Test signed update and Electron restart
        run: xvfb-run -a node dev/test-updater-restart.mjs

      - name: Test update popover
        working-directory: vscode
        run: >-
          xvfb-run -a .build/electron/openide test/unit/electron/index.js
          --no-sandbox --disable-gpu --ozone-platform=x11
          --runGlob 'vs/workbench/contrib/update/test/electron-browser/openideUpdateAnnouncement.test.js'

      - name: Verify welcome, chat and Zen mode in the running IDE
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a node dev/smoke-upgrade.mjs

      - name: Test IDE bridge with real Electron windows
        run: |
          ulimit -c 0
          xvfb-run -a vscode/.build/electron/openide dev/test-ide-bridge.mjs --no-sandbox --ozone-platform=x11

      - name: Test hosted CLI in the running IDE
        run: xvfb-run -a node dev/test-hosted-cli.mjs

      - name: Test native harness in the running IDE
        run: xvfb-run -a node dev/test-harness-runtime.mjs

      - name: Publish fork integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-integration-${{ github.run_id }}
          path: .build/fork-hardening/
          if-no-files-found: warn
          retention-days: 14

  restore-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: vscode
        run: npm ci
      - name: Transpile canonical source
        working-directory: vscode
        run: npm run transpile-client
      - name: Test restore on native Windows filesystem
        working-directory: vscode
        run: >-
          node node_modules/mocha/bin/mocha.js --ui tdd --timeout 30000 --exit
          --reporter json --reporter-option output=../.build/fork-hardening/windows-restore/results.json
          out/vs/workbench/contrib/openideAgent/test/node/openideCliRestore.test.js
          out/vs/platform/openideAgentHost/test/node/openideRestoreLocks.test.js

      - name: Publish Windows restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-restore-${{ github.run_id }}
          path: .build/fork-hardening/windows-restore/
          if-no-files-found: warn
          retention-days: 14
