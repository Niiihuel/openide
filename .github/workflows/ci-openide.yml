name: CI OpenIDE

on:
  workflow_dispatch: {}
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        # Ninguno de estos jobs hace push: sin esto el token del checkout queda escrito en
        # `.git/config` y puede viajar dentro de un artifact.
        with: { persist-credentials: false }

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install native dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev

      - name: Install JavaScript dependencies
        working-directory: vscode
        run: npm ci

      - name: Validate reliability gates
        run: |
          node dev/check-reliability-gates.mjs
          node --test dev/reliability-gates.test.mjs

      - name: Audit distributed OpenIDE branding
        run: node dev/audit-branding.mjs

      - name: Audit comment language
        run: node dev/audit-comment-language.mjs

      - name: Audit surface tokens
        run: node dev/audit-surface-tokens.mjs

      - name: Compile canonical source
        working-directory: vscode
        run: npm run compile

      - name: Test signed updater contract
        working-directory: vscode
        run: >-
          ./node_modules/.bin/mocha --ui tdd --timeout 10000 --exit
          out/vs/platform/update/test/common/openideUpdateManifest.test.js
          out/vs/platform/update/test/node/openideUpdateVerifier.test.js
          out/vs/platform/update/test/electron-main/openideAppImageUpdater.test.js

      - name: Test OpenIDE agent common
        working-directory: vscode
        run: >-
          ./node_modules/.bin/mocha --ui tdd --timeout 10000 --exit
          out/vs/platform/openideAgentHost/test/common/openideAgentHost.test.js
          out/vs/workbench/contrib/openideAgent/test/common/*.test.js

      # Los contratos estáticos sobre el repositorio: que cada setting declarado se lea, que el
      # índice de búsqueda de Settings no apunte a superficies muertas, que lo que el layout
      # reserva y lo que el CSS pinta midan lo mismo, y que un Build de plan no pueda arrancar
      # sobre un run vivo. Se quedaron fuera del CI cuando se agregaron: los cuatro estaban rotos
      # sin que nada lo dijera, y dos denunciaban problemas reales.
      - name: Test OpenIDE repository contracts
        working-directory: vscode
        run: >-
          ./node_modules/.bin/mocha --ui tdd --timeout 10000 --exit
          out/vs/workbench/contrib/openideAgent/test/node/*.test.js

      - name: Install Chromium for browser tests
        working-directory: vscode
        run: npx playwright install --with-deps chromium

      - name: Test OpenIDE agent browser
        working-directory: vscode
        run: >-
          npm run test-browser-no-install --
          --runGlob 'vs/workbench/contrib/openideAgent/test/browser/*.test.js'
          --browser chromium
